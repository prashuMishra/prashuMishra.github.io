<!DOCTYPE html><html>
<head>
    <title>Table Config Generator</title>
    <script>
        function generateSQL() {
            let tableScript = document.getElementById("tableScript").value;
            let lines = tableScript.split("\n");
            let sql = "INSERT INTO config_table (column_name, column_type, column_precision, column_scale) VALUES\n";let values = [];
        for (let line of lines) {
            let match = line.match(/(\w+)\s+(\w+)\s*?(\d+)?(?:,(\d+))??/i);
            if (match) {
                let columnName = match[1];
                let columnType = match[2].toUpperCase();
                let columnPrecision = match[3] ? match[3] : (columnType === 'FLOAT' ? '126' : 'NULL');
                let columnScale = match[4] ? match[4] : (columnType === 'NUMBER' ? '0' : 'NULL');
                values.push(`('${columnName}', '${columnType}', ${columnPrecision}, ${columnScale})`);
            }
        }
        
        if (values.length > 0) {
            sql += values.join(",\n") + ";";
        } else {
            sql = "No valid columns found in the input.";
        }
        
        document.getElementById("output").textContent = sql;
    }
</script>

</head>
<body>
    <h2>Table Config Generator</h2>
    <textarea id="tableScript" rows="10" cols="80" placeholder="Paste your CREATE TABLE script here..."></textarea>
    <br>
    <button onclick="generateSQL()">Generate SQL</button>
    <h3>Generated SQL:</h3>
    <pre id="output"></pre>
</body>
</html>
