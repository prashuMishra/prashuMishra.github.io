<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQL Parser</title>
</head>
<body>
    <h3>Enter SQL CREATE TABLE Statement:</h3>
    <textarea id="inputSql" rows="6" cols="50"></textarea><br>
    <button onclick="convertSql()">Convert</button>
    <h3>Output SQL:</h3>
    <textarea id="outputSql" rows="6" cols="50" readonly></textarea>

    <script>
        function convertSql() {
            let input = document.getElementById("inputSql").value;
            let lines = input.split("\n").map(line => line.trim()).filter(line => line && !line.startsWith("CREATE TABLE") && !line.startsWith("(") && !line.startsWith(")"));

            let values = lines.map(line => {
                let parts = line.split(/\s+/);
                let columnName = parts[0];
                let typeDetails = parts[1].replace(",", "");
                
                let columnType, precision = "Null", scale = "Null";
                
                if (typeDetails.startsWith("VARCHAR2")) {
                    columnType = "VARCHAR";
                    precision = typeDetails.match(/(\d+)/)?.[1] || "Null";
                } else if (typeDetails.startsWith("FLOAT")) {
                    columnType = "FLOAT";
                    let floatMatch = typeDetails.match(/(\d+),\s*(\d+)/);
                    if (floatMatch) {
                        precision = floatMatch[1];
                        scale = floatMatch[2];
                    }
                }

                return `('${columnName}', '${columnType}', ${precision}, ${scale})`;
            });

            let output = `INSERT INTO config_table (column_name, column_type, column_precision, column_scale) VALUES\n` + values.join(",\n") + ";";
            document.getElementById("outputSql").value = output;
        }
    </script>
</body>
</html>
